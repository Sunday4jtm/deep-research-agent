<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>研知 · Deep Research Agent</title>
<style>
  /* ============================================================
     研知 · 静态前端（Perplexity 答案页 × Linear 暗色，手写无依赖）
     改版原则：不设辅助标签与说明文字，层级交给
     字号×字重×灰阶×留白×对齐五个布局变量承载（NN/g #8 + Geist 阶梯）
     色板：近黑底 / 灰阶层次 / 发丝边框 / 唯一 teal 强调
     ============================================================ */
  :root {
    --bg: #0f1011; --panel: #17181a; --border: #26282b; --border-soft: #1f2124;
    --text: #ededf0; --text-2: #b6bac1; --muted: #8a8f98; --faint: #5a5f66;
    --accent: #3ecfbb; --accent-dim: #1fa595;
    --kb: #a78bfa; --web: #60a5fa;
    --warn: #c8a94e; --err: #e07a6e; --ok: #4cb782;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.7 -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
         -webkit-font-smoothing: antialiased; }

  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 28px; border-bottom: 1px solid var(--border-soft); }
  .wordmark { font-weight: 650; letter-spacing: -0.02em; font-size: 15px; }
  .wordmark em { font-style: normal; color: var(--accent); }
  header .right { display: flex; align-items: center; gap: 16px; }
  /* provider·模式是评测对照的关键信息，保留但降为纯 mono 小字（去胶囊边框） */
  .provider { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  header a { color: var(--muted); text-decoration: none; font-size: 12.5px; }
  header a:hover { color: var(--text-2); }

  main { max-width: 780px; margin: 0 auto; padding: 0 20px 80px; }

  /* ---- 首屏：大输入（副标题与操作说明已删——placeholder 与建议 chips 本身即引导） ---- */
  #home { padding-top: 13vh; text-align: center; }
  #home h1 { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 24px; }
  .prompt { display: flex; gap: 10px; align-items: flex-end;
            background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 12px 12px 16px; transition: border-color .15s; }
  .prompt:focus-within { border-color: var(--accent-dim); }
  .prompt textarea { flex: 1; background: none; border: none; outline: none; resize: none;
                     color: var(--text); font: inherit; line-height: 1.6; max-height: 160px; }
  .prompt textarea::placeholder { color: var(--faint); }
  .go { background: var(--accent-dim); color: #06110f; border: none; border-radius: 8px;
        padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .go:hover { background: var(--accent); }
  .go:disabled { background: #1b1d1f; color: var(--faint); cursor: default; }

  /* 模式分段控件：短词自明，被删的解释语义下沉到 title（无障碍层） */
  .modes { display: inline-flex; gap: 2px; margin-top: 18px;
           border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
  .mode-chip { font-size: 12.5px; color: var(--muted); border: none; background: none;
               border-radius: 7px; padding: 5px 16px; cursor: pointer; }
  .mode-chip.on { color: var(--text); background: #232529; }
  .chips { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .chip { font-size: 12.5px; color: var(--muted); border: 1px solid var(--border);
          border-radius: 999px; padding: 5px 14px; cursor: pointer; background: none; }
  .chip:hover { color: var(--text-2); border-color: #3a3d41; }

  /* ---- 运行态：状态只靠点的形态与计数行，不用动词文案 ---- */
  #run { padding-top: 40px; display: none; }
  .status { display: flex; align-items: center; gap: 10px; min-height: 20px;
            font-size: 13px; color: var(--muted); }
  #meta { font-variant-numeric: tabular-nums; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
  .dot.run { background: #e2b93b; animation: pulse 1.2s ease-in-out infinite; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  .bar { height: 2px; background: var(--border-soft); border-radius: 2px; margin: 10px 0 26px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent-dim); transition: width .6s; }

  /* 思考链时间线：stage 前缀是结构信息，保留但降为弱灰 mono（让文本自己说话） */
  #thoughts { border-left: 2px solid var(--border); padding-left: 14px; margin: 4px 0 2px; }
  #thoughts:empty { display: none; }
  .thought { font-size: 12.5px; color: var(--text-2); padding: 3px 0; }
  .thought b { color: var(--faint); font-family: var(--mono); font-size: 11px;
               font-weight: 400; letter-spacing: .06em; margin-right: 8px; }

  /* 来源 chips 紧贴思考链下方：chips 本身自明，不再挂"取证来源"区块标签 */
  #sources { display: flex; flex-wrap: wrap; gap: 7px; }
  #sources:empty { display: none; }
  .src { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2);
         background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
         padding: 5px 11px; max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .src.kb i { background: var(--kb); } .src.web i { background: var(--web); }
  .src .eid { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

  /* ---- 报告即文档：撤卡片容器，发丝线分隔来源与正文（Gemini/Kimi 同款趋势） ---- */
  #reportDoc { display: none; border-top: 1px solid var(--border-soft); margin-top: 26px; padding-top: 22px; }
  #report { font-size: 15px; line-height: 1.85; color: #d6d9dd; }
  #report h1, #report h2, #report h3 { letter-spacing: -0.01em; color: var(--text); margin: 1.5em 0 .5em; }
  #report h1 { font-size: 22px; } #report h2 { font-size: 17.5px; } #report h3 { font-size: 15.5px; }
  #report h4 { font-size: 14.5px; font-weight: 650; color: var(--text); }
  #report p { margin: .8em 0; }
  #report li { margin: .35em 0; }
  #report code { font-family: var(--mono); font-size: 12.5px; background: #0f1011;
                 border: 1px solid var(--border-soft); border-radius: 4px; padding: 1px 5px; }
  #report a { color: var(--accent); text-decoration: none; }
  .caret { display: inline-block; width: 7px; height: 15px; background: var(--accent);
           vertical-align: -2px; animation: pulse 1s steps(2) infinite; }

  /* 对账行：数字即标签的一行元信息；好状态（全部映射）不占版面，坏状态以红色出现 */
  #stats { display: none; margin-top: 20px; font-size: 12.5px; color: var(--muted); }
  #stats b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  #stats b.bad { color: var(--err); }

  /* 事件审计：塌缩为一行计数（Perplexity "Completed N steps" 同款），展开仍是全量 JSON */
  #logWrap { display: none; margin-top: 30px; border-top: 1px solid var(--border-soft); padding-top: 12px; }
  #logWrap summary { cursor: pointer; font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  #log { font-family: var(--mono); font-size: 11.5px; color: var(--faint);
         max-height: 260px; overflow: auto; margin-top: 10px; }
  #log div { padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log .w { color: var(--warn); } #log .e { color: var(--err); }

  /* 错误框挂在 main 层：首屏探活失败也要能告知（不随 run 区块隐藏） */
  .errbox { display: none; margin-top: 18px; border: 1px solid #3a2b29; background: #1c1413;
            color: var(--err); border-radius: 10px; padding: 12px 16px; font-size: 13.5px; }
</style>
</head>
<body>
<header>
  <span class="wordmark">研知 <em>·</em> Deep Research Agent</span>
  <span class="right">
    <span class="provider" id="modePill"></span>
    <a href="https://cloud.langfuse.com" target="_blank" rel="noreferrer">Langfuse ↗</a>
  </span>
</header>

<main>
  <section id="home">
    <h1>今天研究什么？</h1>
    <div class="prompt">
      <textarea id="q" rows="1" aria-label="研究问题" placeholder="例：混合检索相比纯向量检索解决了什么问题？"></textarea>
      <button class="go" id="go">开始研究</button>
    </div>
    <div class="modes" role="group" aria-label="Agent 模式">
      <button class="mode-chip on" data-mode="research" title="流水线：规划→多跳取证→验证→综合，过程可评测">流水线</button>
      <button class="mode-chip" data-mode="react" title="ReAct：自主循环，边想边查">ReAct</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section id="run" style="display: none">
    <div class="status"><i class="dot run" id="dot"></i><span id="meta" aria-live="polite"></span></div>
    <div class="bar"><i id="barFill" style="width: 4%"></i></div>
    <div id="thoughts"></div>
    <div id="sources"></div>
    <div id="reportDoc"><div id="report"></div></div>
    <div id="stats"></div>
    <details id="logWrap"><summary id="logCount"></summary><div id="log"></div></details>
  </section>

  <div class="errbox" id="errbox" role="alert"></div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const IMG_RE = /!\[[^\]]*\]\([^)]*\)/g;   // 报告剥外链图片（数据外泄通道，同后端口径）

/* ---------- 极简 markdown 渲染：先转义再白名单转换，防注入 ---------- */
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function md(src) {
  const lines = esc(src).split("\n");
  const out = [];
  let inList = false;
  const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
  for (const raw of lines) {
    let line = raw
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\[E(\d+)\]/g, '<sup style="color:var(--accent);font-size:11px">E$1</sup>');
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    const li = /^\s*[-*]\s+(.*)$/.exec(line);
    if (h) { closeList(); out.push(`<h${h[1].length + 1}>${h[2]}</h${h[1].length + 1}>`); }
    else if (li) { if (!inList) { out.push("<ul>"); inList = true; } out.push(`<li>${li[1]}</li>`); }
    else if (line.trim() === "") { closeList(); }
    else { closeList(); out.push(`<p>${line}</p>`); }
  }
  closeList();
  return out.join("\n");
}

/* 千位折叠：计数行里 1240 → 1.2k——数字即标签，别让元信息比正文还长 */
const fmtK = (n) => n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(n);

/* ---------- 建议问题 ---------- */
const EXAMPLES = [
  "混合检索相比纯向量检索解决了什么问题？",
  "RRF 融合的原理是什么？公网推荐参数和私有库一致吗？",
  "Agentic RAG 的多跳研究和单轮 RAG 差在哪？",
];
for (const t of EXAMPLES) {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = t;
  b.onclick = () => { $("q").value = t; start(); };
  $("chips").appendChild(b);
}

/* ---------- 状态机：计数行代替动词文案，阶段感交给点的颜色与动画 ---------- */
let running = false;
let agentMode = localStorage.getItem("agentMode") || "research";
for (const b of document.querySelectorAll(".mode-chip")) {
  b.onclick = () => {
    agentMode = b.dataset.mode;
    localStorage.setItem("agentMode", agentMode);
    for (const x of document.querySelectorAll(".mode-chip"))
      x.classList.toggle("on", x.dataset.mode === agentMode);
  };
  b.classList.toggle("on", b.dataset.mode === agentMode);
}
const setUI = (home, run) => { $("home").style.display = home; $("run").style.display = run; };
const setDot = (cls) => { $("dot").className = "dot " + cls; };
const showErr = (msg) => { $("errbox").textContent = msg; $("errbox").style.display = "block"; };

let roundN = 0, srcN = 0, text = "";
const renderMeta = () => {
  const parts = [];
  if (roundN) parts.push("第 " + roundN + " 轮");
  if (srcN) parts.push(srcN + " 来源");
  if (text) parts.push(fmtK(text.length) + " 字");
  $("meta").textContent = parts.join(" · ");
};

const addLog = (type, payload, cls) => {
  $("logWrap").style.display = "block";
  $("logCount").textContent = ($("log").children.length + 1) + " 事件";
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = `[${type}] ` + JSON.stringify(payload).slice(0, 160);
  $("log").appendChild(d);
};

async function start() {
  const question = $("q").value.trim();
  if (!question || running) return;
  running = true;
  $("go").disabled = true;
  setUI("none", "block");
  $("sources").innerHTML = ""; $("report").innerHTML = ""; $("log").innerHTML = "";
  $("logWrap").style.display = "none"; $("logWrap").open = false; $("logCount").textContent = "";
  $("stats").innerHTML = ""; $("stats").style.display = "none";
  $("reportDoc").style.display = "none"; $("errbox").style.display = "none";
  $("thoughts").innerHTML = "";
  roundN = 0; srcN = 0; text = ""; renderMeta();
  setDot("run");
  $("barFill").style.width = "4%";

  /* delta 高频到达而渲染是全量重建——80ms 节流合并（open-webui #20878 的卡顿教训） */
  let renderTimer = null;
  const doRender = () => {
    $("report").innerHTML = md(text.replace(IMG_RE, "[图片已屏蔽]")) +
      (running ? '<span class="caret"></span>' : "");
  };
  const render = () => {
    if (renderTimer) return;
    renderTimer = setTimeout(() => { renderTimer = null; doRender(); }, 80);
  };

  try {
    const resp = await fetch("/api/research", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, agent_mode: agentMode }),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!frame.startsWith("data: ")) continue;
        handle(JSON.parse(frame.slice(6)));
      }
    }
  } catch (err) {
    setDot("err");
    // 同源 fetch 失败日常只有一种原因：网关没起。一句话说清，不再附运维命令。
    showErr(/fetch/i.test(String(err && err.message)) ? "网关未启动" : "失败 · " + err.message);
  }
  running = false;
  $("go").disabled = false;
  if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
  doRender();  // 收尾渲染：去 caret，确保节流器手里最后一批 delta 一定上屏

  function handle(ev) {
    const p = ev.payload || {};
    addLog(ev.type, p, ev.type === "warning" ? "w" : ev.type === "error" ? "e" : "");
    switch (ev.type) {
      case "research_started":
        if (p.provider_mode) $("modePill").textContent = p.agent_mode
          ? p.provider_mode + " · " + (p.agent_mode === "react" ? "ReAct" : "pipeline")
          : p.provider_mode;
        $("barFill").style.width = "12%"; break;
      case "round_started":
        roundN = p.round;
        $("barFill").style.width = Math.min(15 + p.round * 18, 70) + "%";
        renderMeta(); break;
      case "evidence_added": {
        srcN++;
        const el = document.createElement("span");
        el.className = "src " + p.source_type;
        // 事件 payload 来自外部检索结果，统一过 esc 再进 innerHTML（同报告渲染口径）——
        // eid 也不豁免：今天由服务端生成，契约哪天带上来源信息就是注入面（评审 P2）
        el.innerHTML = "<i></i><span class=\"eid\">" + esc(String(p.eid || "")) + "</span>" +
          esc(String(p.title || p.locator || "").slice(0, 60));
        el.title = p.locator || "";
        $("sources").appendChild(el);
        renderMeta(); break;
      }
      case "report_delta":
        $("reportDoc").style.display = "block";  // 第一段到达即入文档态
        text += p.text || ""; render(); renderMeta();
        $("barFill").style.width = "82%"; break;
      case "report_reset":
        text = ""; doRender(); renderMeta(); break;
      case "thought": {
        const d = document.createElement("div");
        d.className = "thought";
        d.innerHTML = "<b>" + esc(String(p.stage || "think")) + "</b>" + esc(String(p.text || ""));
        $("thoughts").appendChild(d);
        break;
      }
      case "warning":
        break;
      case "error":
        setDot("err");
        showErr(p.msg || "未知错误"); break;
      case "done": {
        const c = p.citation_report || {};
        const tu = p.token_usage || {};
        const tokens = Object.values(tu).reduce((a, b) => a + (b || 0), 0);
        // unmapped_total 是契约字段（完整计数）；旧 payload 无此字段时退回列表长度。
        // 旧实现拿 len(截断到10的列表) 当计数：幻觉 15 个编号显示 10（评审 P1）
        const unmapped = c.unmapped_total !== undefined ? c.unmapped_total : (c.unmapped || []).length;
        let line = `<b>${c.refs_total ?? "-"}</b> 引用 · <b>${c.refs_unique ?? "-"}</b> 去重 · ` +
          `<b>${c.mapped ?? "-"}</b> 映射 · <b>${c.evidence_total ?? "-"}</b> 证据 · ` +
          `<b>${fmtK(tokens)}</b> tok`;
        if (unmapped > 0) line += ` · <b class="bad">${unmapped}</b> 未映射`;
        $("stats").innerHTML = line;
        $("stats").style.display = "block";
        setDot("ok");
        $("barFill").style.width = "100%";
        break;
      }
    }
  }
}

$("go").onclick = start;
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); start(); }
});
$("q").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px";
});

/* 首屏探活：网关不在就提前亮红框——保留可诊断性，但不占用常态版面 */
fetch("/api/health").then(r => r.json()).catch(() => showErr("网关未启动"));
</script>
</body>
</html>
