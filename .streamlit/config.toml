# 研知 · 前端主题（第二轮：Linear 式克制暗色）
# 参照：Linear 应用面（#0f1011 底、#f7f8f8 文字层级、无彩色 + 发丝边框）
# 与 Perplexity 答案页（单一 teal 强调、留白、来源 chips）。
[theme]
base = "dark"
primaryColor = "#1FA595"             # 唯一强调色（克制的 teal），只给交互件
backgroundColor = "#0F1011"          # 应用底（Linear 同款近黑）
secondaryBackgroundColor = "#17181A" # 面板/卡片
textColor = "#EDEDEF"
font = "sans serif"
