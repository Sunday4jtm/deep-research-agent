# 项目元数据与工具配置（对齐姊妹项目《AI 学习监督员》的 ruff 规则集，
# 保证两个仓库的静态检查口径一致；冲刺期不发布为 pip 包，只做配置载体）。
[project]
name = "deep-research-agent"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 与老仓库同款规则集：E/F/W 基础 + I 导入排序 + UP 升级 + B bugbear + C4 + SIM
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
markers = [
    "slow: 需要真实网络/模型的慢测试，`-m \"not slow\"` 时跳过",
]
pythonpath = ["."]
addopts = "-q"
