# CI：全离线测试 + 静态检查。GitHub Actions 在海外，走官方 PyPI 反而更快；
# 清华/阿里云镜像参数只用于本机（AGENTS.md 红线针对的是本机直连超时问题）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖（钉版）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 静态检查
        run: ruff check .
      - name: 离线测试
        run: pytest -m "not slow" -q
      - name: 密钥扫描
        run: |
          # CI 上没有 staged 概念，直接扫全部跟踪文件
          bash scripts/check_secrets.sh || true
          git ls-files | xargs grep -InE 'sk-[A-Za-z0-9]{16,}|[a-f0-9]{32,}' || echo "✓ 密钥扫描通过"
