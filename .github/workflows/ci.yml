# CI：全离线测试 + 静态检查。GitHub Actions 在海外，走官方 PyPI 反而更快；
# 清华/阿里云镜像参数只用于本机（AGENTS.md 红线针对的是本机直连超时问题）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖（钉版）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 静态检查
        run: ruff check .
      - name: 离线测试
        run: pytest -m "not slow" -q
      - name: 密钥扫描
        # 评审 P0-2 修复：旧写法 `|| true` 吞退出码、内联 grep 命中反而退出 0，
        # 扫描永远绿灯；现在统一走 check_secrets.sh --all（pattern 单一来源，
        # 且比旧内联版多扫智谱形态 id.secret），命中即非 0 退出、CI 真变红
        run: bash scripts/check_secrets.sh --all
